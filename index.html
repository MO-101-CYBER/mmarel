<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MMAREL graphic design portfolio.">
    <title>MMAREL</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="announcement-bar">ALL THESE PROJECT ARE PASSION PROJECTS, THEY ARE NOT REAL COMMISSIONED PROJECTS</div>

    <header class="site-header">
      <div class="brand-lockup">
        <a class="brand" href="./" aria-label="MMAREL home">MMAREL</a>
        <div class="brand-subtitle">WORK PORTFOLIO</div>
        <a class="brand-social" href="https://www.instagram.com/mmareloarabilezathe/" target="_blank" rel="noopener noreferrer" aria-label="MMAREL on Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8Zm8.7 2.2a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6ZM12 7.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8Zm0 2a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8Z"/>
          </svg>
        </a>
      </div>
    </header>

    <main>
      <section class="gallery-shell" aria-label="MMAREL portfolio gallery">
        <div class="gallery-status" id="galleryStatus" role="status">Loading</div>
        <div class="gallery-grid" id="gallery" aria-live="polite"></div>
      </section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-backdrop" type="button" aria-label="Close image" data-close-lightbox></button>
      <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Portfolio image viewer">
        <button class="icon-button lightbox-close" type="button" aria-label="Close image" data-close-lightbox>&times;</button>
        <button class="icon-button lightbox-prev" type="button" aria-label="Previous image" data-lightbox-prev>&lsaquo;</button>
        <img id="lightboxImage" alt="">
        <button class="icon-button lightbox-next" type="button" aria-label="Next image" data-lightbox-next>&rsaquo;</button>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
